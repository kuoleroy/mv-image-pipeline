# Skillsmith 桌面版：构建 Windows 安装包 + 发布 Release
#
# 设计要点：
#  · 仓库只放源码，二进制走 Release 附件（行业标准做法）。
#    别人不用 clone + npm install 下 464MB 的 Electron 才有 exe。
#  · 推 tag（v*）才发 Release；推 main 只做构建验证 + 存 artifact。
#  · 发布用 GitHub runner 自带的 gh CLI，不引第三方 action —— 少一个供应链环节。
#  · 无代码签名证书，跳过签名（CI 里设 CSC_IDENTITY_AUTO_DISCOVERY=false）。

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '同时发布 Release 的 tag（如 v1.0.0）。留空则只构建、不发布。'
        required: false
        default: ''

permissions:
  contents: write

# 同一个分支只跑一次，新的推送取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: skillsmith/electron/package-lock.json

      - name: Install dependencies
        working-directory: skillsmith/electron
        env:
          # Electron 37+ 不再有自带的 postinstall，我们在 package.json 里
          # 补了 postinstall 调 install.js 来下载运行时（~250MB）。
          # 镜像地址末尾不能带 v —— @electron/get 的 BASE_URL 不含 v，
          # 版本号自带的 v 前缀由它自己拼，多写会变成 vv45.2.1 直接 404。
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm ci

      - name: Unit tests
        working-directory: skillsmith
        run: node test_agent_config.js

      - name: Stage app files
        working-directory: skillsmith/electron
        run: node stage.js

      - name: Build NSIS installer
        working-directory: skillsmith/electron
        env:
          # 没有代码签名证书，跳过签名流程（否则 electron-builder 会去找证书失败）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 用官方源。runner 在 GitHub 机房，直连最快。
          # 若在受限网络里构建，可换成：
          #   ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          #   ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: |
          npx electron-builder --win --x64 --publish never --config.electronDist="node_modules/electron/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skillsmith-Setup-${{ github.sha }}
          path: skillsmith/electron/dist/*.exe
          if-no-files-found: error

      - name: Publish Release
        # 只在打 tag 时发布；手动触发时可指定 tag。
        #
        # 注意条件写法：必须先判 github.event_name。
        # 非手动触发时 inputs 上下文为空，null != '' 在 Actions 表达式里
        # 是 true —— 直接写 inputs.tag != '' 会导致 push 到 main 也去发 Release。
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          if (-not $tag) { throw "TAG 为空，终止发布" }
          Write-Host "Publishing release: $tag"
          gh release create $tag `
            "skillsmith/electron/dist/*.exe" `
            --title "Skillsmith $tag" `
            --generate-notes `
            --verify-tag
